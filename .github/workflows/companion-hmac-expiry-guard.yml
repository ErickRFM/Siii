name: Companion HMAC expiry guard

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: companion-hmac-expiry-guard
  cancel-in-progress: false

jobs:
  expiry-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Non-secret metadata. Update ONLY after verifying the successor in MongoDB and production.
      HMAC_KEY_ID: ${{ vars.SIII_HMAC_WATCH_KEY_ID || 'siii-hmac-20261025-138dedb2ba5840759868ff77844616a7' }}
      HMAC_EXPIRES_AT: ${{ vars.SIII_HMAC_WATCH_EXPIRES_AT || '1793591855' }}
      ALERT_WINDOW_SECONDS: '1209600'
    steps:
      - name: Validate metadata and alert on expiry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HMAC_EXPIRES_AT" =~ ^[0-9]{10,12}$ ]] || { echo 'INVALID_HMAC_EXPIRY_METADATA' >&2; exit 1; }
          [[ "$HMAC_KEY_ID" =~ ^[a-zA-Z0-9_-]{8,128}$ ]] || { echo 'INVALID_HMAC_KEY_ID_METADATA' >&2; exit 1; }
          now=$(date -u +%s)
          remaining=$((HMAC_EXPIRES_AT - now))
          echo "HMAC_CREDENTIAL_REMAINING_SECONDS=$remaining"
          if (( remaining > ALERT_WINDOW_SECONDS )); then
            echo 'HMAC_EXPIRY_NOT_IMMINENT'
            exit 0
          fi
          # Each key gets its own issue; old open issues cannot hide warnings for a successor.
          title="Security: rotate SIII Companion HMAC [$HMAC_KEY_ID]"
          issue_number=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null) | [.number,.title] | @tsv' | awk -F '\t' -v expected="$title" '$2 == expected {print $1; exit}')
          if (( remaining <= 0 )); then
            urgency='EXPIRED: signed SIII → Compañero requests may be rejected.'
          elif (( remaining <= 86400 )); then
            urgency='CRITICAL: less than 24 hours to expiry.'
          elif (( remaining <= 259200 )); then
            urgency='URGENT: less than three days to expiry.'
          elif (( remaining <= 604800 )); then
            urgency='WARNING: less than seven days to expiry.'
          else
            urgency='NOTICE: less than fourteen days to expiry.'
          fi
          body=$(printf '%s\n' "Credential keyId: \`$HMAC_KEY_ID\`" "Expiry (UTC): $(date -u -d "@$HMAC_EXPIRES_AT" +%Y-%m-%dT%H:%M:%SZ)" "$urgency" '' 'This alert is based on repository metadata, NOT a live verifier query. Confirm credential state in MongoDB before declaring renewal.' 'Required: issue successor; overlap validation; smoke tests 200/401, nonce and tenant; promote issuer; confirm production traffic; revoke predecessor with audit.' 'No secret is retrieved, logged or modified.')
          if [[ -z "$issue_number" ]]; then
            gh api -X POST "repos/$GH_REPO/issues" -f title="$title" -f body="$body" --jq '.html_url'
            echo 'HMAC_ROTATION_ISSUE_CREATED'
          else
            # Refresh the issue each day to escalate urgency without creating duplicates.
            gh api -X PATCH "repos/$GH_REPO/issues/$issue_number" -f body="$body" >/dev/null
            echo "HMAC_ROTATION_ISSUE_UPDATED=#$issue_number"
          fi
          if (( remaining <= 0 )); then
            echo 'HMAC_CREDENTIAL_EXPIRED' >&2
            exit 1
          fi
          echo 'HMAC_EXPIRY_WARNING'
