name: SIII Agent Coordination (plan only)

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scripts/agents/**'
      - 'tests/agents/**'
      - 'docs/agent/AGENT_COORDINATION.md'
      - '.github/workflows/agent-coordination.yml'

permissions:
  contents: read

concurrency:
  group: agent-coordination-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify planner behavior and safety gates
        run: node --test tests/agents/*.test.mjs
      - name: Generate deterministic, read-only coordination plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .p0-local/agent-plan
          node scripts/agents/plan.mjs --format json > .p0-local/agent-plan/schedule.json
          node scripts/agents/plan.mjs --format markdown > .p0-local/agent-plan/schedule.md
          cat .p0-local/agent-plan/schedule.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish synthetic plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: siii-agent-coordination-plan
          path: .p0-local/agent-plan/
          if-no-files-found: error
          retention-days: 7
