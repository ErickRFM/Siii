name: Verify SIS
on:
  push:
    branches: [feat/**, main]
  pull_request:
    branches: [main, feat/sis-foundation]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: university_sis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/university_sis_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: git diff -- package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
