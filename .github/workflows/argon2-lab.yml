name: Argon2 representative Linux lab
on:
  push:
    branches: ['chore/p0-1-release-gates']
    paths: ['scripts/benchmark-argon2.ts', '.github/workflows/argon2-lab.yml']
  workflow_dispatch:
    inputs:
      approvedRepresentative:
        description: 'Explicit human approval for this synthetic Linux Node24 / 1vCPU / 1GiB lab (not production hosting validation)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: argon2-representative-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lab:
    if: ${{ vars.SIII_ARGON2_LAB_APPROVED == '1' && (github.event_name != 'workflow_dispatch' || inputs.approvedRepresentative == true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require explicit representative lab approval
        env:
          REPOSITORY_LAB_APPROVED: ${{ vars.SIII_ARGON2_LAB_APPROVED }}
          EVENT_NAME: ${{ github.event_name }}
          APPROVED_REPRESENTATIVE: ${{ inputs.approvedRepresentative }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY_LAB_APPROVED" = "1" || {
            printf '%s\n' 'ARGON2_LAB_APPROVAL_REQUIRED'
            exit 1
          }
          if test "$EVENT_NAME" = "workflow_dispatch"; then
            test "$APPROVED_REPRESENTATIVE" = "true" || {
              printf '%s\n' 'ARGON2_LAB_APPROVAL_REQUIRED'
              exit 1
            }
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve immutable Linux Node 24 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 node:24-bookworm-slim
          image_id="$(docker image inspect --format '{{.Id}}' node:24-bookworm-slim)"
          printf 'ARGON2_IMAGE=%s\n' "$image_id" >> "$GITHUB_ENV"
      - name: Install locked native dependencies in Linux
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --cpus 1 --memory 1g --memory-swap 1g --pids-limit 128 \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$ARGON2_IMAGE" sh -eu -c '
              npm ci --ignore-scripts
              npm rebuild argon2 esbuild
            '
          git diff --exit-code -- package-lock.json
          mkdir -p .argon2-lab
      - name: Native component benchmark, no network or application server
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --network none \
            --cpus 1 --memory 1g --memory-swap 1g --pids-limit 128 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --ulimit core=0 --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --env HOME=/tmp --env NODE_ENV=test --env UV_THREADPOOL_SIZE=4 \
            --env SIII_ARGON2_LAB_APPROVED=1 \
            --env "SIII_ARGON2_SOURCE_SHA=$GITHUB_SHA" \
            --env "SIII_ARGON2_IMAGE_DIGEST=$ARGON2_IMAGE" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/.argon2-lab:/results:rw" \
            --workdir /workspace "$ARGON2_IMAGE" \
            timeout --signal=TERM --kill-after=5s 200s \
            node --import tsx scripts/benchmark-argon2.ts \
              --run --approved-representative --saturation-8 \
              --operations 24 --warmup 2 --runtime-seconds 120 \
              --output /results/argon2-lab-report.json
      - name: Upload only aggregate laboratory report
        if: ${{ always() && vars.SIII_ARGON2_LAB_APPROVED == '1' && (github.event_name != 'workflow_dispatch' || inputs.approvedRepresentative == true) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: argon2-linux24-1cpu-1g-${{ github.run_id }}
          path: .argon2-lab/argon2-lab-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

