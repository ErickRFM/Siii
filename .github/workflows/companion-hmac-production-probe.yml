name: Verify SIII Companion HMAC successor

on:
  workflow_dispatch: {}
  schedule:
    - cron: '41 12 * * *'

permissions:
  contents: read

jobs:
  verify-successor:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Wake Compañero Render backend before the signed probe
        shell: bash
        run: |
          set -euo pipefail
          # Render Free can cold-start for more than the Vercel function's
          # 25-second upstream timeout. Wait for an HTTP response from the
          # application before asking SIII to perform the signed handshake.
          ready=0
          for attempt in $(seq 1 15); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}'               --max-time 12 --connect-timeout 6               'https://compa-ero-de-esc.onrender.com/health' || true)"
            # 404 is also evidence the Ktor application is serving requests,
            # if this version does not expose /health. Reject proxy 5xx.
            if [[ "$code" =~ ^(2[0-9][0-9]|404)$ ]]; then
              ready=1
              echo "COMPANION_BACKEND_READY_HTTP=$code"
              break
            fi
            echo "COMPANION_BACKEND_NOT_READY_ATTEMPT=$attempt STATUS=$code"
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            echo "COMPANION_BACKEND_COLD_START_TIMEOUT" >&2
            exit 1
          fi
      - name: Verify read-only production handshake (200, 401, nonce replay)
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET}" ]]; then
            echo 'CRON_SECRET_NOT_CONFIGURED' >&2
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --max-time 110 --connect-timeout 10 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header 'Cache-Control: no-store' \
            'https://siii-three.vercel.app/api/internal/companion-hmac-probe')"
          if [[ "$status" != 200 ]]; then
            echo "HMAC_PROBE_HTTP_STATUS=$status" >&2
            node -e '
              const fs=require("node:fs");
              try {
                const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                const keys=["status","validStatus","contractVerified","invalidStatus","replayStatus","passed"];
                for(const key of keys)if(typeof x[key]==="boolean"||typeof x[key]==="number"||typeof x[key]==="string")process.stdout.write(key+"="+String(x[key]).slice(0,60)+"\\n");
              } catch {process.stdout.write("HMAC_PROBE_RESPONSE_UNREADABLE\\n");}
            ' "$response_file"
            exit 1
          fi
          node -e '
            const fs=require("node:fs");
            const result=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(result.passed!==true||result.validStatus!==200||result.invalidStatus!==401||result.replayStatus!==401||result.contractVerified!==true||result.academicWritesPerformed!==false){
              process.stderr.write("HMAC_PROBE_ASSERTION_FAILED\\n");process.exit(1);
            }
            process.stdout.write("HMAC_SUCCESSOR_HANDSHAKE_VERIFIED\\n");
          ' "$response_file"
